services:
  - type: web
    name: er-wait-time-api
    runtime: python
    plan: free
    buildCommand: pip install -r summative/API/requirements.txt
    startCommand: uvicorn summative.API.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
    healthCheckPath: /health
